name: Nightly forward paper record
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - 'research/**'
      - 'scripts/tracks.py'
      - 'scripts/build_site.py'
      - 'scripts/site.css'
      - 'scripts/site.html'
      - 'scripts/site.js'
      - 'scripts/site_metrics.js'
      - 'site_assets/**'
      - '.github/workflows/nightly.yml'
permissions:
  contents: read
concurrency:
  group: nightly-forward-paper-main
  cancel-in-progress: false
jobs:
  forward:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      freeze_result: ${{ steps.freeze.outcome }}
      snapshot_result: ${{ steps.snapshot.outcome }}
    env:
      FREEZE_BASE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # runner context is not available in job-level env; set the path at step level.
      - name: Set freeze transition path
        run: echo "FREEZE_TRANSITION=$RUNNER_TEMP/universe-transition.json" >> "$GITHUB_ENV"
      - name: Take pending R7/R8 snapshot after the registered window closes
        id: snapshot
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          pending = json.loads(Path('universes/r7.json').read_text())['status'] == 'pending'
          if pending and datetime.now(timezone.utc) >= datetime(2026, 10, 27, tzinfo=timezone.utc):
              subprocess.run(['python3', 'scripts/build_universes.py', '--only', 'r7'], check=True)
          PY
      - name: Verify frozen strategies before installing or running
        id: freeze
        run: |
          if ! python3 scripts/freeze_check.py; then
            python3 - <<'PYCODE'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('results/health.json')
          ledger = json.loads(path.read_text()) if path.exists() else {'runs': []}
          ledger['runs'].append({'run_date': datetime.now(timezone.utc).isoformat(),
              'success': False, 'data_freshness': False, 'pairs_ok': [], 'pairs_missing': [],
              'duration_seconds': 0, 'before': {}, 'after': {}, 'reason': 'freeze'})
          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n')
          PYCODE
            exit 1
          fi
      - name: Scan public source before installing or publishing
        run: python3 scripts/secret_scan.py
      - name: Monthly workflow keepalive (also on manual runs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$(date -u +%d)" = '01' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            gh api --method PUT "repos/$GH_REPO/actions/workflows/nightly.yml/enable"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned engine and binary TA-Lib
        run: python -m pip install --only-binary=TA-Lib -r requirements.txt
      - name: Tests and lint
        run: |
          python -m pytest -q
          ruff check .
      - name: UTC date for daily data cache
        id: cache-date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/binance
          key: daily-ohlcv-${{ runner.os }}-${{ hashFiles('universes/*.json', 'user_data/config_*.json') }}-${{ steps.cache-date.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            daily-ohlcv-${{ runner.os }}-${{ hashFiles('universes/*.json', 'user_data/config_*.json') }}-${{ steps.cache-date.outputs.day }}-
            daily-ohlcv-${{ runner.os }}-${{ hashFiles('universes/*.json', 'user_data/config_*.json') }}-
      - name: Update closed daily data and forward record
        id: update
        run: python scripts/run_forward.py
      - name: Record preflight failure when engine was never started
        if: always() && steps.freeze.outcome == 'success' && steps.update.outcome == 'skipped'
        run: |
          python3 - <<'PYCODE'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('results/health.json')
          ledger = json.loads(path.read_text()) if path.exists() else {'runs': []}
          ledger['runs'].append({'run_date': datetime.now(timezone.utc).isoformat(),
              'success': False, 'data_freshness': False, 'pairs_ok': [], 'pairs_missing': [],
              'duration_seconds': 0, 'before': {}, 'after': {}, 'reason': 'preflight_failed'})
          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n')
          PYCODE
      - name: Scan generated results before committing
        if: always()
        id: result_scan
        run: python3 scripts/secret_scan.py
      - name: Commit results if changed
        if: always() && steps.result_scan.outcome == 'success' && steps.freeze.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/ universes/ frozen.json listing_dates.json user_data/config_r7.json user_data/config_r8.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update forward paper record [skip ci]'
            git push origin HEAD:main
          fi
  pages:
    needs: forward
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.forward.result == 'success' ||
       (github.event_name == 'push' && needs.forward.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fetch main AFTER the forward job commits its validated results.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan source before building
        run: python3 scripts/secret_scan.py
      - name: Build static dashboard
        run: python3 scripts/build_site.py
      - name: Scan generated site before publishing
        run: python3 scripts/secret_scan.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
  report:
    needs: [forward, pages]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write success or failure summary
        env:
          SNAPSHOT_RESULT: ${{ needs.forward.outputs.snapshot_result }}
          FREEZE_RESULT: ${{ needs.forward.outputs.freeze_result }}
          FORWARD_RESULT: ${{ needs.forward.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PAGES_RESULT" = 'success' ] && { [ "$FORWARD_RESULT" = 'success' ] || [ "$EVENT_NAME" = 'push' ]; }; then
            echo '## Başarılı — Trade Lab' >> "$GITHUB_STEP_SUMMARY"
            echo 'Doğrulanan sonuçlar secret taramasından geçti; site yayımlandı.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Başarısız veya iptal edildi — Trade Lab' >> "$GITHUB_STEP_SUMMARY"
            echo 'Tamamlanamayan adımları inceleyin. Site güncel olmayabilir.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "İleri dönem: $FORWARD_RESULT · Pages: $PAGES_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "[Çalışma kaydı]($RUN_URL) · [Site](https://trade.blacktowhitestudio.com)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add metrics to summary
        if: needs.pages.result == 'success'
        run: |
          python3 - <<'PY'
          import os
          from scripts.notify_telegram import build_message
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n' + build_message() + '\n')
          PY
      - name: Optional nightly Telegram notification
        if: always() && github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SNAPSHOT_RESULT: ${{ needs.forward.outputs.snapshot_result }}
          FREEZE_RESULT: ${{ needs.forward.outputs.freeze_result }}
          FORWARD_RESULT: ${{ needs.forward.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
        run: |
          if [ "$FORWARD_RESULT" = 'success' ] && [ "$PAGES_RESULT" = 'success' ]; then
            python3 scripts/notify_telegram.py
          else
            python3 scripts/notify_telegram.py --failed
          fi
      - name: Note notification failure
        if: failure()
        run: echo 'Bildirim veya raporlama adımı başarısız; çalışma günlüğünü inceleyin.' >> "$GITHUB_STEP_SUMMARY"
