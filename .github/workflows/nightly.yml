name: Nightly forward paper record
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-forward-paper-main
  cancel-in-progress: false
jobs:
  forward:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan public source before installing or publishing
        run: python3 scripts/secret_scan.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned engine and binary TA-Lib
        run: python -m pip install --only-binary=TA-Lib -r requirements.txt
      - name: Tests and lint
        run: |
          python -m pytest -q
          ruff check .
      - name: Update closed daily data and forward record
        run: python scripts/run_forward.py
      - name: Scan generated results before committing
        run: python scripts/secret_scan.py
      - name: Commit results if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/
          if ! git diff --cached --quiet; then
            git commit -m 'Update forward paper record [skip ci]'
            git push origin HEAD:main
          fi
